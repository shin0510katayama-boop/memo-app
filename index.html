<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>Memo</title>
    <meta name="description" content="ブラウザに保存されるシンプルなメモアプリ" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <section class="list-screen" id="list-screen">
        <header class="topbar">
          <div class="brand">
            <div class="logo" aria-hidden="true">記</div>
            <div>
              <h1>Memo</h1>
              <p class="tagline">この端末に保存</p>
            </div>
          </div>
        </header>
        <div class="search-wrap">
          <input id="search" type="search" placeholder="メモを検索" autocomplete="off" enterkeyhint="search" />
        </div>
        <nav class="filters" aria-label="フィルター">
          <button class="filter is-active" data-filter="all">すべて <span id="count-all">0</span></button>
          <button class="filter" data-filter="pinned">ピン <span id="count-pinned">0</span></button>
          <button class="filter" data-filter="archive">アーカイブ <span id="count-archive">0</span></button>
        </nav>
        <ul id="memo-list" class="memo-list"></ul>
        <p id="list-empty" class="list-empty hidden">該当するメモはありません</p>
        <button id="new-btn" class="fab" type="button" aria-label="新しいメモ">＋</button>
      </section>
      <section class="editor-screen" id="editor-screen">
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-card">
            <h2>メモがありません</h2>
            <p>新しいメモを作成してください。</p>
            <button id="empty-new" class="primary" type="button">最初のメモを書く</button>
          </div>
        </div>
        <article id="editor" class="editor hidden">
          <div class="editor-nav">
            <button id="back-btn" class="icon-btn" type="button">← 一覧</button>
            <div class="editor-nav-actions">
              <button id="pin-btn" class="chip" type="button">ピン</button>
              <button id="archive-btn" class="chip" type="button">アーカイブ</button>
              <button id="delete-btn" class="chip danger" type="button">削除</button>
            </div>
          </div>
          <div class="colors" id="color-picks" role="group" aria-label="色"></div>
          <input id="title" class="title-input" type="text" placeholder="タイトル" maxlength="120" enterkeyhint="next" />
          <textarea id="body" class="body-input" placeholder="本文を入力"></textarea>
          <footer class="editor-meta">
            <span id="updated-at">未保存</span>
            <span id="char-count">0 文字</span>
          </footer>
        </article>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
